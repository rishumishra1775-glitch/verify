<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Verification</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 40px 20px; background-color: #f4f7f6; color: #333; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        h2 { color: #0088cc; margin-bottom: 10px; }
        p { font-size: 14px; color: #666; margin-bottom: 25px; }
        button { background-color: #0088cc; color: white; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; }
        button:hover { background-color: #006699; }
        #status { margin-top: 20px; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🛡️ Device Verification</h2>
        <p>Anti-cheat protection: Click below to verify your device hardware profile.</p>
        <button id="verifyBtn">Verify This Device</button>
        <div id="status"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function getCanvasFingerprint() {
            try {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                ctx.textBaseline = "top";
                ctx.font = "14px 'Arial'";
                ctx.fillStyle = "#f60";
                ctx.fillRect(125,1,62,20);
                ctx.fillStyle = "#069";
                ctx.fillText("BhaicharaBotVerification#123", 2, 15);
                ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
                ctx.fillText("BhaicharaBotVerification#123", 4, 17);
                return canvas.toDataURL();
            } catch(e) {
                return "no-canvas";
            }
        }

        document.getElementById('verifyBtn').addEventListener('click', async () => {
            const statusDiv = document.getElementById('status');
            statusDiv.style.color = "#0088cc";
            statusDiv.innerText = "Verifying device identity...";

            const canvasFp = getCanvasFingerprint();
            const fpData = {
                user_id: tg.initDataUnsafe?.user?.id || 0,
                initData: tg.initData,
                screen: `${window.screen.width}x${window.screen.height}x${window.screen.colorDepth}`,
                ua: navigator.userAgent,
                platform: navigator.platform,
                fp: canvasFp
            };

            const deviceToken = btoa(encodeURIComponent(JSON.stringify(fpData))).substring(0, 40);

            tg.sendData(JSON.stringify({ action: "device_verified", token: deviceToken }));
            
            statusDiv.style.color = "green";
            statusDiv.innerText = "✅ Device verified successfully!";
            setTimeout(() => { tg.close(); }, 1500);
        });
    </script>
</body>
</html>
