<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Verification</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 25px; background: #f0f2f5; color: #333; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .cf-turnstile { margin: 20px auto; display: flex; justify-content: center; }
        #status { font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h3>🛡️ Human & Device Check</h3>
        <p>Complete the security check to continue.</p>
        
        <!-- Cloudflare Turnstile Widget -->
        <div class="cf-turnstile" data-sitekey="1x00000000000000000000AA" data-callback="onTurnstileSuccess"></div>
        
        <p id="status"></p>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        function onTurnstileSuccess(token) {
            const status = document.getElementById("status");
            status.style.color = "blue";
            status.innerText = "Verifying Device Hardware...";

            // Generating lightweight canvas fingerprint combined with turnstile
            let canvasFp = "";
            try {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                ctx.fillText("CF_Device_Check_2026", 2, 2);
                canvasFp = canvas.toDataURL();
            } catch(e) { canvasFp = "no-canvas"; }

            let hash = 0;
            const rawStr = navigator.userAgent + window.screen.width + "x" + window.screen.height + canvasFp;
            for (let i = 0; i < rawStr.length; i++) {
                hash = ((hash << 5) - hash) + rawStr.charCodeAt(i);
                hash |= 0;
            }

            const deviceToken = "CF_DEV_" + Math.abs(hash);
            const payload = JSON.stringify({
                action: "device_verified",
                token: deviceToken,
                cf_token: token
            });

            if (tg && tg.sendData) {
                status.style.color = "green";
                status.innerText = "✅ Verified! Closing...";
                tg.sendData(payload);
                setTimeout(() => { tg.close(); }, 800);
            } else {
                status.style.color = "red";
                status.innerText = "❌ Open inside Telegram Mobile App!";
            }
        }
    </script>
</body>
</html>
